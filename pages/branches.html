<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filiales | Palmeras en la Mancha Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/reset.css">
  <link rel="stylesheet" href="../src/css/style.css">
  <link rel="stylesheet" href="../src/css/variable.css">
  <link rel="stylesheet" href="../src/css/branches.css">
  <link rel="stylesheet" href="../src/css/responsive.css">

</head>

<body>
  <div data-component="header"></div>

  <main id="app" class="container">
  <section class="intro" aria-labelledby="page-title">
    <div class="intro__content">
      <p class="eyebrow">RED DE TIENDAS, CENTRALES Y SEDES</p>
      <h1 id="page-title">Filiales</h1>
      <p class="intro__text">
        Red de tiendas físicas, nacionales y en el extranjero. Explora nuestra
        red de sucursales y conoce más sobre la gestión de personal especializado.
      </p>
    </div>
  </section>

  <section class="directory" aria-label="Directorio de tiendas">
    <div class="filters">
      <label class="search-box">
        <span class="sr-only">Filtrar por nombre</span>
        <input id="name-filter" type="search" placeholder="Filtrar por nombre">
      </label>

      <label class="search-box">
        <span class="sr-only">Filtrar por dirección</span>
        <input id="address-filter" type="search" placeholder="Filtrar por dirección">
      </label>

      <label class="search-box">
        <span class="sr-only">Filtrar por teléfono</span>
        <input id="phone-filter" type="search" placeholder="Filtrar por teléfono">
      </label>
    </div>

    <div class="table-wrap">
      <div class="table-heading" aria-hidden="true">
        <span>ID</span>
        <span>NOMBRE</span>
        <span>DIRECCIÓN</span>
        <span>TELÉFONO</span>
      </div>

      <div id="store-list" class="store-list" aria-live="polite"></div>

      <p id="empty-message" class="empty-message" hidden>
        No se encontraron tiendas con esos filtros.
      </p>
    </div>

    <div class="list-footer">
      <p id="results-count">Cargando tiendas…</p>

      <!-- <nav class="pagination" aria-label="Paginación">
        <button type="button" class="page-arrow" aria-label="Página anterior">‹</button>
        <button type="button" class="page-number is-current" aria-current="page">1</button>
        <button type="button" class="page-arrow" aria-label="Página siguiente">›</button>
      </nav> -->
    </div>
  </section>
</main>

<div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- <script src="../src/js/main.js"></script> -->
  <script src="../src/js/loadComponent.js"></script>
  <script src="../src/js/branches.js"></script>

</body>
</html>
